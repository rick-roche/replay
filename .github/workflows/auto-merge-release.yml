name: Auto-merge Release Please PR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'release-please--branches--main' ||
      github.event.workflow_run.head_branch == 'release-please--branches--main--components--replay')
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pull_request_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --state open \
            --json number,headRefName,headRepository,title,body,labels \
            | jq -r --arg branch "${HEAD_BRANCH}" --arg repo "${GITHUB_REPOSITORY}" \
              '[.[]
                | select(.headRefName == $branch
                  and .headRepository.nameWithOwner == $repo
                  and (.title | test("^chore\\(main\\): release [0-9]+\\.[0-9]+\\.[0-9]+$"))
                  and (.body | contains("This PR was generated with [Release Please]"))
                  and any(.labels[]; .name == "autorelease: pending"))]
                | first | .number // empty')"

          if [[ -z "${pull_request_number}" ]]; then
            echo "No open Release Please pull request found for ${HEAD_BRANCH}."
            exit 0
          fi

          pull_request_sha="$(gh pr view "${pull_request_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json headRefOid \
            --jq '.headRefOid')"

          if [[ "${pull_request_sha}" != "${CI_SHA}" ]]; then
            echo "Release PR has moved since this CI run; waiting for newer CI."
            exit 0
          fi

          gh pr merge "${pull_request_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --match-head-commit "${CI_SHA}" \
            --delete-branch
